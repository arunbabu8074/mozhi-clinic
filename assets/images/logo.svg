<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Leaf / speech-bubble mark -->
  <g>
    <!-- Outer leaf shape -->
    <path d="M20 40 C20 20 36 8 52 8 C68 8 72 20 72 32 C72 50 58 64 40 68 C36 69 32 68 30 65 L24 72 C22 74 19 72 20 69 L22 60 C20.5 53 20 46 20 40 Z"
          fill="#8FAF94" opacity="0.18"/>
    <!-- Inner accent -->
    <path d="M30 38 C30 24 40 16 52 16 C62 16 64 26 64 32 C64 46 54 58 40 62 C37 63 34 61 33 59 L29 64 C28 66 26 64 27 62 L29 55 C29.5 50 30 44 30 38 Z"
          fill="#8FAF94" opacity="0.45"/>
    <!-- Core dot -->
    <circle cx="48" cy="34" r="4" fill="#8FAF94"/>
    <!-- Speech lines -->
    <line x1="38" y1="30" x2="56" y2="30" stroke="#8FAF94" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="38" y1="36" x2="52" y2="36" stroke="#8FAF94" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="38" y1="42" x2="48" y2="42" stroke="#8FAF94" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Malayalam word: മൊഴി -->
  <text x="85" y="46"
        font-family="'Noto Sans Malayalam', 'Manjari', Georgia, serif"
        font-size="30"
        font-weight="400"
        fill="#1E1E1E"
        letter-spacing="1">മൊഴി</text>

  <!-- Vertical divider -->
  <line x1="168" y1="22" x2="168" y2="58" stroke="#1E1E1E" stroke-width="0.75" opacity="0.18"/>

  <!-- Subtitle stacked -->
  <text x="180" y="35"
        font-family="'DM Sans', Arial, sans-serif"
        font-size="8.5"
        font-weight="400"
        fill="#4A4A47"
        letter-spacing="2.5">COUNSELING</text>
  <text x="180" y="48"
        font-family="'DM Sans', Arial, sans-serif"
        font-size="8.5"
        font-weight="400"
        fill="#4A4A47"
        letter-spacing="2.5">&amp; THERAPY</text>
  <text x="180" y="61"
        font-family="'DM Sans', Arial, sans-serif"
        font-size="8.5"
        font-weight="400"
        fill="#4A4A47"
        letter-spacing="2.5">CENTRE</text>
</svg>
